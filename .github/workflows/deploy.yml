# Release to Azure: run on demand (Actions > Deploy > Run workflow) from main. The whole CI suite runs first and
# must pass. Azure sign-in uses GitHub OIDC with the "id-oregon-github" managed identity (infra: github_repository),
# so no Azure credential is stored in GitHub. Infrastructure changes (terraform apply) stay a local, reviewed step.
#
# One-time setup (see docs/build-and-deploy.md, "Deploying from GitHub"):
#   - repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (terraform output github_deploy)
#   - an environment named "production" (optionally with required reviewers)
name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: What to release
        type: choice
        options: [all, worker, web]
        default: all

permissions:
  contents: read

# Never run two releases at once, and never cancel one halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Release ${{ inputs.target }}
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for azure/login
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure sign-in (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # scripts/deploy.sh does the whole release in the safe order: build both images (tagged with this commit), run
      # the migrate job with the new web image, roll out the worker before the web app, smoke-test the site through
      # Cloudflare and roll back to the previous images if anything fails. Same script as a local release.
      # --allow-unpushed: the commit came from GitHub, so it is pushed by definition (the shallow checkout has no
      # remote branch refs to prove it).
      - name: Deploy (build, migrate, roll out, smoke test, roll back on failure)
        env:
          TARGET: ${{ inputs.target }}
          # Optional environment secret: enables the login + voyage round trip in the smoke test.
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: scripts/deploy.sh --target "$TARGET" --local --allow-unpushed

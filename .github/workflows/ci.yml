# Continuous integration: every push to main, every pull request, on demand, and as the gate in front of deploy.yml.
# Jobs run in parallel; any failure fails the run. Actions are pinned to commit SHAs (tags can be moved).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  NODE_VERSION: "24"

jobs:
  dotnet:
    name: .NET build, tests, vulnerable packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore oregon.slnx

      # Right after restore (it reuses the restore output). The listing command has been seen to abort right after a
      # test run, so it runs before the tests and gets one retry; a non-zero exit fails the step either way.
      - name: Fail on known-vulnerable NuGet packages
        run: |
          check() { dotnet list oregon.slnx package --vulnerable --include-transitive > vulnerable.txt 2>&1; }
          check || { echo "Retrying the vulnerability check once."; sleep 5; check; }
          cat vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable NuGet packages found (see above)."
            exit 1
          fi

      # Warnings are errors and code style is enforced (Directory.Build.props, .editorconfig).
      - name: Build
        run: dotnet build oregon.slnx -c Release --no-restore

      # Includes PostgreSQL via Testcontainers (Docker is on the runner), a Temporal dev server the SDK downloads,
      # the 45 scripted playthroughs, balance bands and the workflow replay tests.
      - name: Test
        run: dotnet test --solution oregon.slnx -c Release --no-build


  frontend:
    name: Frontend type-check, lint, unit tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - run: npm ci
      - name: Type-check, ESLint, oxlint, Vitest
        run: npm run check
      - run: npm run build

      # Only what ships to browsers; dev tooling advisories are tracked but don't block.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

  e2e:
    name: End-to-end (Playwright + axe) on the full local stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      # PostgreSQL + Temporal in Docker, SPA + backend + worker built and started (offline fake LLM: no API keys).
      - name: Build and start the site
        run: |
          ./buildAndRunSite.sh > site.log 2>&1 &
          for _ in $(seq 1 300); do
            if curl -fs -o /dev/null http://localhost:5069/healthz/ready; then echo "Site is ready."; exit 0; fi
            sleep 2
          done
          echo "::error::The site did not become ready."
          tail -n 100 site.log
          exit 1

      - name: Install Chromium for Playwright
        working-directory: app/frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright
        working-directory: app/frontend
        run: npm run test:e2e

      - name: Upload Playwright report and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-diagnostics
          path: |
            app/frontend/playwright-report/
            app/frontend/test-results/
            site.log
            artifacts/logs/
          if-no-files-found: ignore
          retention-days: 7

  infra:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.17.1"
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      # No backend and no credentials: validation only needs the providers pinned in .terraform.lock.hcl.
      - run: terraform init -backend=false -lockfile=readonly -input=false
      - run: terraform validate

  scripts-and-workflows:
    name: ShellCheck + actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Commits made from Windows tools drop the executable bit, and the scripts then fail on Linux with
      # "Permission denied" (fix: git add --chmod=+x <file>).
      - name: Shell scripts are executable in git
        run: |
          missing="$(git ls-files -s -- '*.sh' | awk '$1 != "100755" {print $4}')"
          if [ -n "$missing" ]; then
            echo "::error::Not executable in git (run: git add --chmod=+x <file>):"
            echo "$missing"
            exit 1
          fi
      - name: ShellCheck
        run: shellcheck -x buildAndRunSite.sh scripts/*.sh scripts/lib/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  images:
    name: Docker images build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same Dockerfiles and context the release scripts use; nothing is pushed.
      - name: Web image
        run: docker build --file app/Dockerfile --tag oregon-web:ci .
      - name: Worker image
        run: docker build --file worker/Dockerfile --tag oregon-worker:ci .
